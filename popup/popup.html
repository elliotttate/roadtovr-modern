<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Road to VR — Horizon</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="../assets/brand/road-to-vr-logo.png" alt="Road to VR">
        <span>Horizon reader</span>
      </header>

      <label class="toggle-row">
        <span>
          <strong>Redesign</strong>
          <small>Apply on Road to VR</small>
        </span>
        <input id="enabled" type="checkbox">
        <i aria-hidden="true"></i>
      </label>

      <div class="field">
        <label for="theme">Appearance</label>
        <select id="theme">
          <option value="system">Follow system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>

      <div class="field range-field">
        <div><label for="fontScale">Text size</label><output id="fontOutput"></output></div>
        <input id="fontScale" type="range" min="0.9" max="1.2" step="0.05">
      </div>

      <div class="field range-field">
        <div><label for="readingWidth">Reading width</label><output id="widthOutput"></output></div>
        <input id="readingWidth" type="range" min="620" max="820" step="20">
      </div>

      <div class="saved-row">
        <span><b id="savedCount">0</b> saved stories</span>
        <button id="clearSaved" type="button">Clear</button>
      </div>

      <a class="visit" href="https://roadtovr.com/" target="_blank" rel="noreferrer">Open Road to VR <span aria-hidden="true">↗</span></a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
